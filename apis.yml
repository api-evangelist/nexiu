name: Nexiu
description: >-
  Nexiu (Nexiu AI LLC) is a Latin America-focused recruiting automation platform
  that uses AI agents to source, contact, screen, and schedule high-volume
  candidates over the official WhatsApp Business API, integrating with Google
  Workspace (Gmail, Calendar, Meet) and existing ATS systems and job boards. It
  offers a fully managed pay-per-hire service (Nexiu Managed) and a self-service
  SaaS platform (Nexiu Platform) for internal talent-acquisition teams, and is
  backed by 500 Global (500 Latam) and NVIDIA Inception. As of this pass Nexiu
  consumes third-party APIs (WhatsApp Business, Google, Anthropic Claude, OpenAI)
  but does not publish a public developer API of its own.
